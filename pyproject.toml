[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-identity-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1"]

# The installed artifact is one stdlib-only module; dev tools stay in dependency groups.
[tool.uv]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }

[project.scripts]
ghi = "gh_identity:main"
gh_identity = "gh_identity:main"

[tool.setuptools]
py-modules = ["gh_identity"]
