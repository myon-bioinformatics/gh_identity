name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12","3.13","3.14","3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Compile
        run: python -m py_compile gh_identity.py
      - name: Import smoke
        run: python -c "import gh_identity"
      - name: CLI smoke
        run: python gh_identity.py --help
      - name: Tests with JUnit
        run: python -m pytest -q tests --junitxml=reports/junit.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 14
