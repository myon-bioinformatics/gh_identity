name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile gh_identity.py
      - name: Import smoke
        run: python -c "import gh_identity"
      - name: CLI smoke
        run: python gh_identity.py --help
      - name: Tests
        run: python -m unittest discover -s tests -v
