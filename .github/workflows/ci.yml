name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      parent_ref:
        description: "Parent ref for the shared vendor tool. Empty resolves latest main."
        required: false
        default: ""
        type: string
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@main

  vendor-locked:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    name: Vendor locked baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Parent vendor-consumers-compat.yml checks out 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
      # as a historical tool and registry fixture (.compat/parent-old). This job fetches
      # the live vendor tool, so it resolves parent main at runtime instead of that fixture.
      - name: Resolve parent main and fetch shared vendor tool
        env:
          PARENT_REF_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.parent_ref || '' }}
        run: |
          set -euo pipefail
          remote="https://github.com/myon-bioinformatics/myon-bioinformatics.git"
          override="${PARENT_REF_OVERRIDE:-}"
          if [[ -n "$override" ]]; then
            if [[ ! "$override" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Rejected parent ref override" >&2
              exit 1
            fi
            requested="$override"
            source_label="workflow_dispatch override"
          else
            requested="main"
            source_label="refs/heads/main"
          fi
          if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha="$(printf '%s' "$requested" | tr '[:upper:]' '[:lower:]')"
          else
            sha="$(git ls-remote "$remote" "refs/heads/${requested}" | awk 'NR==1 { print $1 }')"
            if [[ -z "$sha" ]]; then
              sha="$(git ls-remote "$remote" "refs/tags/${requested}^{}" | awk 'NR==1 { print $1 }')"
            fi
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve parent ref to a commit SHA" >&2
            exit 1
          fi
          rm -rf .vendor-sync-tools
          git init -q .vendor-sync-tools
          git -C .vendor-sync-tools remote add origin "$remote"
          git -C .vendor-sync-tools fetch --depth 1 origin "$sha"
          git -C .vendor-sync-tools checkout -q --detach FETCH_HEAD
          actual="$(git -C .vendor-sync-tools rev-parse HEAD)"
          if [[ "$actual" != "$sha" ]]; then
            echo "Fetched parent commit does not match the resolved SHA" >&2
            exit 1
          fi
          test -f .vendor-sync-tools/vendor_sync.py
          {
            echo "### Shared vendor tool"
            echo ""
            echo "- Resolved parent SHA: ${sha}"
            echo "- Source: ${source_label}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify and recreate locked vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))["files"]:
              Path(entry["destination"]).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  test:
    if: needs.changes.outputs.product_changed == 'true'
    needs: [changes, vendor-locked]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13","3.14","3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install test dependencies
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Compile
        run: python -m py_compile gh_identity.py
      - name: Import smoke
        run: python -c "import gh_identity"
      - name: CLI smoke
        run: python gh_identity.py --help
      - name: Tests with JUnit
        run: python -m pytest -q tests --junitxml=reports/junit.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@main
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.x/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@main
