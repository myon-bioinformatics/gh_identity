name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      parent_ref:
        description: "Parent ref for the shared vendor tool. Empty resolves latest main."
        required: false
        default: ""
        type: string
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  vendor-locked:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    name: Vendor locked baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      # The historical parent compat fixture is not this job. Resolve parent main
      # at runtime, then check the shared tool out at that commit.
      - name: Resolve parent main
        id: parent
        env:
          PARENT_REF_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.parent_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          parent="myon-bioinformatics/myon-bioinformatics"
          expected_id="638801160"
          remote="https://github.com/${parent}.git"
          override="${PARENT_REF_OVERRIDE:-}"
          python -S - "$parent" "$expected_id" <<'PY'
          import json
          import re
          import sys
          import urllib.request

          parent, expected = sys.argv[1], int(sys.argv[2])

          def get(url, accept=None):
              headers = {"User-Agent": "gh-identity-parent-resolve"}
              if accept:
                  headers["Accept"] = accept
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          api = json.loads(get(
              "https://api.github.com/repos/" + parent,
              "application/vnd.github+json",
          ))
          if type(api.get("id")) is not int or api["id"] != expected or api.get("full_name") != parent:
              raise SystemExit("parent repository id mismatch")
          html = get("https://github.com/" + parent).decode("utf-8", "replace")
          id_match = re.search(
              r'<meta name="octolytics-dimension-repository_id" content="(\d+)"',
              html,
          )
          name_match = re.search(
              r'<meta name="octolytics-dimension-repository_nwo" content="([^"]+)"',
              html,
          )
          page_id = int(id_match.group(1)) if id_match else None
          page_name = name_match.group(1) if name_match else None
          if page_id != expected or page_name != parent:
              raise SystemExit("parent repository id mismatch on public page")
          PY
          if [[ -n "$override" ]]; then
            if [[ ! "$override" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Rejected parent ref override" >&2
              exit 1
            fi
            requested="$override"
            source_label="workflow_dispatch override"
          else
            requested="main"
            source_label="refs/heads/main"
          fi
          if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha="$(printf '%s' "$requested" | tr '[:upper:]' '[:lower:]')"
          else
            sha="$(git ls-remote "$remote" "refs/heads/${requested}" | awk 'NR==1 { print $1 }')"
            if [[ -z "$sha" ]]; then
              sha="$(git ls-remote "$remote" "refs/tags/${requested}^{}" | awk 'NR==1 { print $1 }')"
            fi
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve parent ref to a commit SHA" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "### Shared vendor tool"
            echo ""
            echo "- Resolved parent SHA: ${sha}"
            echo "- Source: ${source_label}"
            echo "- Repository id: ${expected_id}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: ${{ steps.parent.outputs.sha }}
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify and recreate locked vendor snapshot
        env:
          EXPECTED_SHA: ${{ steps.parent.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C .vendor-sync-tools rev-parse HEAD)"
          expected="${EXPECTED_SHA}"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ || "$actual" != "$expected" ]]; then
            echo "Fetched parent commit does not match the resolved SHA" >&2
            exit 1
          fi
          test -f .vendor-sync-tools/vendor_sync.py
          strict=0
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            strict=1
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$strict" == "1" ]]; then
            mode="strict"
          else
            mode="report-only"
          fi
          {
            echo "- Vendor hash check: ${mode}"
          } >> "$GITHUB_STEP_SUMMARY"
          hash_check() {
            if python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json; then
              return 0
            fi
            if [[ "$strict" == "1" ]]; then
              echo "Vendor hash check failed" >&2
              exit 1
            fi
            echo "::warning::Vendor hash check failed (report-only for this event)"
          }
          hash_check
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))["files"]:
              Path(entry["destination"]).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          hash_check

  test:
    if: needs.changes.outputs.product_changed == 'true'
    needs: [changes, vendor-locked]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13","3.14","3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Require supported Node in parity CI
        run: node -e "if (+process.versions.node.split('.')[0] < 24) process.exit(1)"
      - name: Install test dependencies
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # The latest lane must not reuse an older system Python before venv creation.
        env:
          UV_PYTHON_PREFERENCE: ${{ matrix.python-version == '3.x' && 'only-managed' || 'managed' }}
        with:
          version: "latest"
          python-version: "${{ matrix.python-version == '3.x' && '3' || matrix.python-version }}"
          activate-environment: true
          enable-cache: false
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Compile
        run: python -m py_compile gh_identity.py
      - name: Import smoke
        run: python -c "import gh_identity"
      - name: CLI smoke
        run: python gh_identity.py --help
      - name: Tests with JUnit
        run: python -m pytest -q tests --junitxml=reports/junit.xml
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.x/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
