name: Pages

# Publishes the usage guide: docs/guide.page.json (a web-ui-page/1 spec, data only). The parent's reusable
# workflow renders it with the PySaiyanWeBoo commit pinned there — no HTML, CSS or JS lives in this repository.
# Pull requests build the page (an invalid spec fails there); only main deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide.page.json"
      - "assets/branding/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "assets/branding/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@dbe7e16be53f9e5b8c9ba29ff6ed8be0899a35ff
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_assets: assets/branding/repository-icon.png=icon.png assets/branding/concept-c-32.png=favicon.png
