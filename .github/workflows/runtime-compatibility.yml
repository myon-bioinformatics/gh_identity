name: Stdlib runtime compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # The latest lane must not reuse an older system Python before venv creation.
        env:
          UV_PYTHON_PREFERENCE: ${{ matrix.python == '3.x' && 'only-managed' || 'managed' }}
        with:
          version: "latest"
          python-version: "${{ matrix.python == '3.x' && '3' || matrix.python }}"
          activate-environment: true
          enable-cache: false
      - name: Exercise runtime behavior without site-packages
        run: python -S -m unittest discover -s tests -p test_gh_identity.py -v
